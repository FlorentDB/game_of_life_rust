<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game of Life — Rust / WASM</title>
    <style>
        :root {
            color-scheme: dark;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #0a2d21;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
        }

        #gol-container {
            width: min(calc(100% - 32px), 1000px);
            aspect-ratio: 5 / 3;
            background: #000;
            border: 2px solid #a2a3a2;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #gol-container canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <div id="gol-container"></div>

    <script type="module">
        import init from "./pkg/life_game_rust.js";

        init().catch((error) => {
            console.error("Game of Life failed to load", error);
            const output = document.createElement("pre");
            output.textContent = String(error);
            document.body.append(output);
        });
    </script>
</body>
</html>
